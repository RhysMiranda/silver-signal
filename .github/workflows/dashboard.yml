# Builds the React dashboard and publishes it to GitHub Pages on every push
# that touches dashboard/. The API address comes from the repository
# variable API_URL (Settings > Secrets and variables > Actions > Variables).
name: dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
